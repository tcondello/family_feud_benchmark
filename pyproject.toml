[project]
name = "family-feud-benchmark"
version = "0.1.0"
description = "LLM Family Feud survey benchmark"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-google-genai>=2.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "nltk>=3.9",
]

[project.scripts]
family-feud = "main:main"
